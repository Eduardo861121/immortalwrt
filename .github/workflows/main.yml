name: 在线编译OAF插件套装 r33421
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: r33421

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: 拉取OpenAppFilter插件源码
        run: |
          cd package
          git clone https://github.com/destan19/OpenAppFilter.git
          cd ..

      - name: 更新feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置 mediatek/filogic MT7981
        run: |
          make defconfig
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_SUBTARGET_MT7981=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-oaf=m" >> .config
          make defconfig

      - name: 只编译OpenAppFilter插件
        run: |
          make package/OpenAppFilter/compile V=s

      - name: 上传ipk包
        uses: actions/upload-artifact@v4
        with:
          name: OAF-ipk-r33421
          path: bin/packages/aarch64_cortex-a53/
